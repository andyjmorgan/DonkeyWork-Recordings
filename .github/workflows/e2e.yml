name: E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (mobile layout)
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: src/frontend
    env:
      E2E_TOKEN_URL: https://auth.donkeywork.dev/realms/Agents/protocol/openid-connect/token
      E2E_CLIENT_ID: recordings-e2e
      E2E_USERNAME: e2e-recordings
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @donkeywork-recordings/web exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm --filter @donkeywork-recordings/web e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/apps/web/playwright-report/
          retention-days: 7
