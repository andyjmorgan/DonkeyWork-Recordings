<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/donkeywork.png" />
    <link rel="apple-touch-icon" href="/donkeywork.png" />
    <title>DonkeyWork Recordings</title>
    <meta
      name="description"
      content="Turn text into a podcast. Post paragraphs over MCP or REST — synthesised with Kokoro TTS into mp3s and published as per-user RSS feeds your podcast app subscribes to."
    />

    <!-- Open Graph / WhatsApp / iMessage link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DonkeyWork Recordings" />
    <meta property="og:title" content="DonkeyWork Recordings" />
    <meta
      property="og:description"
      content="Turn text into a podcast. Post paragraphs over MCP or REST — synthesised with Kokoro TTS into mp3s and published as per-user RSS feeds your podcast app subscribes to."
    />
    <meta property="og:url" content="https://recordings.donkeywork.dev/" />
    <meta property="og:image" content="https://recordings.donkeywork.dev/donkeywork.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="DonkeyWork Recordings" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DonkeyWork Recordings" />
    <meta
      name="twitter:description"
      content="Turn text into a podcast. Post paragraphs over MCP or REST — synthesised with Kokoro TTS into mp3s and published as per-user RSS feeds your podcast app subscribes to."
    />
    <meta name="twitter:image" content="https://recordings.donkeywork.dev/donkeywork.png" />
    <script>
      // Apply persisted theme before render to avoid FOUC.
      try {
        var raw = localStorage.getItem('donkeywork-recordings-theme');
        var theme = raw ? JSON.parse(raw).state.theme : 'dark';
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch {}
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
